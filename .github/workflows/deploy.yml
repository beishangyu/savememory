name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A project site is served from /<repo>/, while a <user>.github.io
      # repository lives at the domain root.
      BASE: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ts-fsrs declares `engines.node >= 24`.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Fail early instead of publishing a page whose assets 404.
      - name: Check the build used the base path
        run: |
          test -f dist/index.html
          if [ "$BASE" != "/" ]; then
            grep -q "${BASE}assets/" dist/index.html
            grep -q "\"start_url\":\"${BASE}\"" dist/manifest.webmanifest
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
